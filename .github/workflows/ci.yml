name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff mypy snakefmt==0.10.3 shellcheck-py pandas pyyaml types-PyYAML

      - name: Ruff lint
        run: ruff check scripts workflow/rules tests

      - name: Ruff format check
        run: ruff format --check scripts workflow/rules tests

      - name: Mypy
        run: mypy scripts/generate_config.py workflow/rules/helpers.py tests

      - name: Snakefmt check
        run: snakefmt --check workflow/rules/*.smk workflow/Snakefile

      - name: Shellcheck
        run: shellcheck -S warning scripts/run_snakemake.sh

  test:
    name: Unit, schema, dry-run & e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ci
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
              - bioconda
              - nodefaults
          create-args: >-
            python=3.11
            pytest
            pandas=2.3.3
            pyyaml=6.0.2
            jsonschema
            snakemake
            cnvkit=0.9.14
            bedtools=2.31.1
            samtools=1.21
            bcftools=1.21
            htslib=1.21

      - name: Solve pinned per-rule conda environments
        shell: bash -el {0}
        run: |
          for f in workflow/envs/*.yaml; do
            micromamba create -y --dry-run -n "solve-$(basename "$f" .yaml)" -f "$f"
          done

      - name: Run full pytest suite
        shell: bash -el {0}
        run: |
          which bedtools samtools bcftools bgzip tabix cnvkit.py Rscript snakemake
          pytest -v
